name: Build Windows EXE

on:
  push:
    branches: [ main, master ]
    tags: [ 'v*' ]
  workflow_dispatch:

jobs:
  build:
    runs-on: windows-latest

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.11'

      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements.txt
          pip install pyinstaller

      - name: Build EXE
        run: >
          pyinstaller
          --noconfirm
          --onedir
          --windowed
          --name "VC-Doc-Importer"
          --icon "assets/icon.ico"
          --add-data "assets;assets"
          --collect-all PySide6
          main.py

      - name: Zip build
        run: Compress-Archive -Path "dist/VC-Doc-Importer/*" -DestinationPath "VC-Doc-Importer-windows.zip"
        shell: pwsh

      - name: Upload artifact
        uses: actions/upload-artifact@v4
        with:
          name: VC-Doc-Importer-windows
          path: VC-Doc-Importer-windows.zip

      - name: Release on tag
        if: startsWith(github.ref, 'refs/tags/')
        uses: softprops/action-gh-release@v2
        with:
          files: VC-Doc-Importer-windows.zip
